name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-16
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, verified 2026-10-16
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python tests/run_sandbox.py
      - run: python scripts/demo.py
      - run: python skills/buywise/scripts/decision_gate.py examples/intake.json
      - run: python skills/buywise/scripts/quote_check.py examples/quote.json
      - run: python skills/buywise/scripts/compare_offers.py examples/offers.json
